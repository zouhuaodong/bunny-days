<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b2f2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="饿疯兔住在你的网页里：摸摸它、喂它小鱼干、陪它玩三个小游戏，攒小鱼干布置小窝。">
<meta property="og:title" content="饿疯兔小屋">
<meta property="og:description" content="一只住在网页里的饿疯兔，会饿会困，摸哪里都有反应。">
<meta property="og:type" content="website">
<title>饿疯兔小屋</title>
<link rel="stylesheet" href="ef-house.css">
</head>
<body>
<div id="app">

  <header class="hud">
    <div class="hud-top">
      <div class="who">
        <span class="dot"></span>
        <span class="name" id="petName">饿疯兔</span>
        <span class="day">第 <b id="days">1</b> 天</span>
      </div>
      <div class="coins" id="coinBox"><span class="fish">🐟</span><b id="coins">20</b></div>
    </div>
    <div class="bars">
      <div class="bar" data-k="food"><span class="ico">🍚</span><i><u id="barFood"></u></i></div>
      <div class="bar" data-k="mood"><span class="ico">💗</span><i><u id="barMood"></u></i></div>
      <div class="bar" data-k="energy"><span class="ico">⚡</span><i><u id="barEnergy"></u></i></div>
    </div>
  </header>

  <main id="room">
    <div class="window">
      <div class="moon"></div>
      <div class="star s1"></div><div class="star s2"></div><div class="star s3"></div>
      <div class="curtain"></div>
    </div>
    <div class="art"><span>🐟</span></div>
    <div class="plant-hang"><span>🌿</span></div>
    <div class="wall-dots"></div>
    <div class="floor"></div>

    <div id="furniture"></div>

    <div id="stage">
      <div class="halo"></div>
      <div id="petWrap">
        <img id="pet" src="ef-assets/pet-happy.png" alt="饿疯兔" draggable="false">
        <div id="fx"></div>
      </div>
      <div id="bubble" class="bubble hidden"></div>
      <div id="zzz" class="zzz hidden"><span>z</span><span>Z</span><span>z</span></div>
    </div>

    <div class="rug"></div>
    <div class="hint" id="hint">摸摸它、喂它小鱼干吧</div>
  </main>

  <nav class="dock">
    <button data-act="pet"><em>🐾</em><span>摸摸</span></button>
    <button data-act="feed"><em>🐟</em><span>喂食</span><i class="badge" id="foodBadge">3</i></button>
    <button data-act="games"><em>🎮</em><span>小游戏</span></button>
    <button data-act="nest"><em>🛏️</em><span>小窝</span></button>
  </nav>
</div>

<!-- ============ 底部弹层 ============ -->
<div id="sheetMask" class="mask hidden"></div>
<section id="sheet" class="sheet hidden">
  <div class="sheet-head">
    <h2 id="sheetTitle">小游戏</h2>
    <button class="x" id="sheetClose">✕</button>
  </div>
  <div id="sheetBody" class="sheet-body"></div>
</section>

<!-- ============ 小游戏全屏层 ============ -->
<div id="gameLayer" class="game-layer hidden">
  <div class="game-head">
    <button id="gameBack" class="gbtn">← 返回</button>
    <div class="game-score">
      <span id="gameTitle">躲猫猫</span>
      <b id="gameScore">0</b>
    </div>
    <button id="gameSound" class="gbtn">🔊</button>
  </div>
  <div id="gameStage" class="game-stage"></div>
  <div id="gameOverlay" class="game-overlay"></div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="ef-house.js"></script>
</body>
</html>
