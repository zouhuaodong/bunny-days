<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f7e7d5"><title>东的小兔屋</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;background:#f7e7d5;color:#654a3a;overscroll-behavior:none}#app{max-width:520px;min-height:100svh;margin:auto;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);background:linear-gradient(#f9eadb,#f5d8bd);display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;padding:14px 4px}.brand{font-weight:900;font-size:21px}.pill{background:#fff9ef;border-radius:30px;padding:8px 12px;font-size:13px;box-shadow:0 3px 12px #9c6b3820}.stats{display:flex;gap:8px}.stat{flex:1;background:#fff9ef;border-radius:14px;padding:9px;text-align:center;font-size:12px}.stat b{display:block;font-size:16px;margin-top:3px}.room{position:relative;flex:1;min-height:340px;border:5px solid #fff5e9;border-radius:28px;overflow:hidden;background:linear-gradient(#cde8ed 0 58%,#ecd1ad 58%);box-shadow:0 8px 24px #9c6b3820}.window{position:absolute;top:9%;left:9%;width:34%;height:34%;border:8px solid #fff5e9;border-radius:16px;background:linear-gradient(#a9d7e5,#f8e4b4)}.sun{position:absolute;width:34px;height:34px;border-radius:50%;background:#ffe49a;right:15%;top:18%}.cloud{position:absolute;background:#fff9e9;width:55px;height:15px;border-radius:20px;left:10%;top:40%}.cloud:before{content:"";position:absolute;width:24px;height:24px;background:inherit;border-radius:50%;left:12px;top:-10px}.plant{position:absolute;bottom:8%;right:8%;font-size:52px}.rug{position:absolute;bottom:5%;left:14%;width:72%;height:23%;border-radius:50%;background:#e9bda0;opacity:.8}.bunny{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);width:180px;height:205px;cursor:pointer;filter:drop-shadow(0 9px 5px #8b5b3a35);animation:bob 2.6s infinite ease-in-out}.ear{position:absolute;top:0;width:48px;height:105px;border-radius:50% 50% 42% 42%;background:linear-gradient(90deg,#e9c18e,#fff0d4 50%,#d8a96f);border:2px solid #e6c59e}.ear:after{content:"";position:absolute;inset:12px 12px 16px;border-radius:50%;background:#e9a9a0;opacity:.55}.ear.l{left:35px;transform:rotate(-13deg)}.ear.r{right:35px;transform:rotate(13deg)}.head{position:absolute;left:9px;right:9px;bottom:0;height:150px;border-radius:48% 48% 45% 45%;background:radial-gradient(circle at 35% 25%,#fff8e8,#f1d5ad 68%,#d9b17f);border:2px solid #e5c49b}.eye{position:absolute;top:58px;width:12px;height:17px;background:#49352d;border-radius:50%}.eye.l{left:48px}.eye.r{right:48px}.cheek{position:absolute;top:83px;width:25px;height:13px;border-radius:50%;background:#efa9a0;opacity:.65}.cheek.l{left:23px}.cheek.r{right:23px}.nose{position:absolute;top:84px;left:50%;width:10px;height:7px;background:#bd8178;border-radius:50%;transform:translateX(-50%)}.mouth{position:absolute;top:91px;left:50%;font-size:17px;transform:translateX(-50%);color:#80554b}.hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;color:#876a55}.bubble{position:absolute;top:13%;right:8%;background:#fffaf0;border-radius:16px;padding:9px 12px;font-size:13px;box-shadow:0 4px 10px #744b2820}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:14px 0}.act{border:0;border-radius:16px;background:#fff9ef;padding:12px 3px;color:#74513d;font-weight:700;box-shadow:0 4px 0 #e7c8a9;font-size:13px}.act span{display:block;font-size:22px;margin-bottom:4px}.panel{background:#fff9ef;border-radius:22px;padding:14px;margin-bottom:14px}.panel h3{margin:0 0 10px;font-size:15px}.bar{height:8px;border-radius:10px;background:#eadac8;overflow:hidden;margin:7px 0}.bar i{display:block;height:100%;background:#e5a66f;border-radius:10px}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}.nav button{border:0;border-radius:14px;background:#e9c9aa;color:#694b38;padding:12px 4px;font-weight:800}.overlay{position:fixed;inset:0;background:#3b281e99;display:none;align-items:center;justify-content:center;padding:18px}.modal{width:min(440px,100%);background:#fff8ee;border-radius:24px;padding:20px;text-align:center}.modal h2{margin:0 0 8px}.modal p{font-size:14px;line-height:1.6}.primary{border:0;background:#d99462;color:white;border-radius:20px;padding:12px 24px;font-weight:800;margin:5px}.secondary{border:0;background:#ead8c4;color:#654a3a;border-radius:20px;padding:12px 20px;margin:5px}@keyframes bob{50%{transform:translate(-50%,-54%)}}@media(min-height:800px){.room{min-height:420px}}
</style></head><body><main id="app"><header class="top"><div class="brand">🐰 东的小兔屋</div><div class="pill">⭐ <b id="coins">120</b></div></header><section class="stats"><div class="stat">❤️ 心情<b id="mood">开心</b></div><div class="stat">🍀 体力<b id="energy">80</b></div><div class="stat">🥕 饱腹<b id="food">70</b></div></section><section class="room"><div class="window"><div class="sun"></div><div class="cloud"></div></div><div class="rug"></div><div class="plant">🪴</div><div class="bubble" id="speech">东：今天也要一起玩！</div><div class="bunny" id="bunny" aria-label="小兔东"><div class="ear l"></div><div class="ear r"></div><div class="head"><i class="eye l"></i><i class="eye r"></i><i class="cheek l"></i><i class="cheek r"></i><i class="nose"></i><i class="mouth">ω</i></div></div><div class="hint">点一点东，摸摸头和它互动</div></section><div class="actions"><button class="act" onclick="act('摸摸头')"><span>🤍</span>摸摸</button><button class="act" onclick="act('喂胡萝卜')"><span>🥕</span>喂食</button><button class="act" onclick="act('玩玩具')"><span>🧸</span>玩耍</button><button class="act" onclick="act('换装成功')"><span>🎀</span>换装</button></div><section class="panel"><h3>东的状态</h3><div>快乐值 <span id="happyN">78</span><div class="bar"><i id="happyBar" style="width:78%"></i></div></div><div>成长值 <span id="growN">24</span><div class="bar"><i id="growBar" style="width:24%"></i></div></div></section><nav class="nav"><button onclick="openGame('跑酷挑战','左右滑动或点击按钮躲开障碍，收集胡萝卜！')">🏃 跑酷</button><button onclick="openGame('勇者战斗','东遇到了森林怪物！选择攻击或防御，赢得金币和经验。')">⚔️ 战斗</button><button onclick="openGame('每日冒险','去森林探险，寻找宝箱和稀有玩具。')">🌳 冒险</button></nav></main><div class="overlay" id="overlay"><div class="modal"><h2 id="modalTitle">小游戏</h2><p id="modalText"></p><div id="gameArea"></div><button class="secondary" onclick="closeGame()">回到兔屋</button></div></div><script>
let coins=120,energy=80,food=70,happy=78,grow=24,hp=100,enemy=60,runScore=0;const $=id=>document.getElementById(id);function update(){$('coins').textContent=coins;$('energy').textContent=energy;$('food').textContent=food;$('happyN').textContent=happy;$('happyBar').style.width=happy+'%';$('growN').textContent=grow;$('growBar').style.width=grow+'%';$('mood').textContent=happy>65?'开心':happy>35?'普通':'想你了'}function say(t){$('speech').textContent='东：'+t}function act(t){if(t==='喂胡萝卜'){food=Math.min(100,food+18);coins=Math.max(0,coins-3);say('嗯！胡萝卜最好吃！')}else if(t==='摸摸头'){happy=Math.min(100,happy+8);say('呼噜呼噜，好舒服～')}else if(t==='玩玩具'){if(energy<8){say('我有点累啦，休息一下吧');return}energy-=8;happy=Math.min(100,happy+12);say('再来一次！')}else{say('新蝴蝶结真漂亮！')}grow=Math.min(100,grow+2);update()}$('bunny').onclick=()=>act('摸摸头');function openGame(name,desc){$('overlay').style.display='flex';$('modalTitle').textContent=name;$('modalText').textContent=desc;let area=$('gameArea');area.innerHTML='';if(name==='跑酷挑战'){runScore=0;area.innerHTML='<h2>🥕 <span id="score">0</span></h2><p>点击“跳跃”躲开木桩，连续收集胡萝卜</p><button class="primary" onclick="jumpRun()">跳跃 / 收集</button><button class="secondary" onclick="endRun()">结束挑战</button>'}else if(name==='勇者战斗'){hp=100;enemy=60;area.innerHTML='<p>🐰 东 HP：<b id="hp">100</b>　👾 怪物 HP：<b id="ehp">60</b></p><button class="primary" onclick="fight(1)">⚔️ 攻击</button><button class="secondary" onclick="fight(0)">🛡️ 防御</button>'}else{area.innerHTML='<button class="primary" onclick="treasure()">打开森林宝箱</button>'}}function jumpRun(){runScore+=10+Math.floor(Math.random()*15);$('score').textContent=runScore;say('跳得真高！');}function endRun(){let reward=Math.floor(runScore/10);coins+=reward;grow=Math.min(100,grow+Math.floor(reward/2));update();$('modalText').textContent='跑酷结束！获得 '+reward+' 枚金币。'}function fight(a){if(a){enemy=Math.max(0,enemy-18);say('看我的胡萝卜旋风！')}else{say('举起小盾牌防御！')}if(enemy>0)hp=Math.max(0,hp-(a?12:4));$('hp').textContent=hp;$('ehp').textContent=enemy;if(enemy===0){coins+=35;grow=Math.min(100,grow+12);update();$('modalText').textContent='胜利！获得35金币和成长值！'}else if(hp===0){$('modalText').textContent='东累倒啦，休息后再来挑战！'}}function treasure(){let n=20+Math.floor(Math.random()*31);coins+=n;grow=Math.min(100,grow+8);update();$('modalText').textContent='发现宝箱！获得 '+n+' 枚金币和成长值！'}function closeGame(){$('overlay').style.display='none'}update();
</script></body></html>
