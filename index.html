<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f4dfc7"><title>东的暖暖兔屋</title><style>
*{box-sizing:border-box}body{margin:0;background:#ead3b9;color:#604533;font-family:system-ui,"PingFang SC",sans-serif}button{font:inherit;touch-action:manipulation;cursor:pointer}#game{width:min(100%,520px);min-height:100svh;margin:auto;padding:env(safe-area-inset-top) 13px env(safe-area-inset-bottom);position:relative;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(#b9dce5 0 28%,#e8d2b7 47%,#c48d5e 100%)}.sky{position:absolute;inset:0 0 auto;height:34%;background:linear-gradient(90deg,#b7dce8,#fff0c6,#a8d1dc);border-bottom:10px solid #fff1df}.sky:after{content:"☀️　☁️";position:absolute;right:9%;top:15%;font-size:30px}.sofa{position:absolute;top:30%;left:-5%;width:57%;height:23%;border-radius:30px;background:linear-gradient(145deg,#aebbd7,#7185ae);box-shadow:inset 0 8px #dce2ef,0 10px 12px #65472c35}.sofa:after{content:"🥕";position:absolute;right:5%;top:-24px;font-size:60px}.shelf{position:absolute;right:0;top:28%;width:25%;height:25%;border:7px solid #d4a16e;background:#bc895b;border-radius:12px 0 0 12px}.shelf:after{content:"📚 🪴 🖼️";font-size:22px}.floor{position:absolute;bottom:0;height:38%;left:0;right:0;background:repeating-linear-gradient(0deg,#c58f61 0 38px,#d7a77b 39px 42px);border-top:8px solid #e8c49c}.rug{position:absolute;bottom:17%;left:8%;right:8%;height:21%;border-radius:50%;background:radial-gradient(ellipse,#fff0dc,#e7cbb2);box-shadow:0 8px 12px #65472c40}.top,.stats,.room,.quick,.status,.nav{position:relative;z-index:2}.top{display:flex;justify-content:space-between;align-items:center;gap:5px}.profile,.money{display:flex;align-items:center;gap:8px;background:#fff8e9e8;border:2px solid white;border-radius:28px;padding:5px 10px;font-size:13px;font-weight:900}.avatar{width:43px;height:43px;border-radius:50%;background:#e6c79f;border:2px solid white;display:grid;place-items:center;font-size:30px}.sub{font-size:10px;color:#a06b43}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:9px 0}.stat{background:#fff8e9e8;border:2px solid white;border-radius:15px;padding:7px 3px;text-align:center;font-size:11px}.stat b{display:block;font-size:16px;color:#67a64b}.room{height:clamp(300px,44svh,450px);min-height:300px}.pet{position:absolute;left:50%;bottom:17%;transform:translateX(-50%);width:184px;height:226px;z-index:3;filter:drop-shadow(0 10px 7px #65472c45);animation:bob 3s infinite;cursor:pointer}.ear{position:absolute;top:0;width:53px;height:116px;border-radius:55%;background:linear-gradient(90deg,#c9955e,#fff0d5 48%,#e3bd8e);border:2px solid #e8cda7}.ear:after{content:"";position:absolute;inset:14px;border-radius:50%;background:#e9a6a0;opacity:.6}.ear.l{left:37px;transform:rotate(-13deg)}.ear.r{right:35px;transform:rotate(13deg);height:100px}.bunny{position:absolute;bottom:0;left:5px;width:174px;height:169px;border-radius:49% 49% 43% 43%;background:radial-gradient(ellipse at 35% 24%,#fff8e8,#f4dfbd 54%,#d9b17f);border:2px solid #e8cda7;box-shadow:inset -9px -8px 15px #c79b6c35}.eye{position:absolute;top:62px;width:13px;height:18px;border-radius:50%;background:#34251e;box-shadow:inset 3px 3px white}.eye.l{left:47px}.eye.r{right:47px}.nose{position:absolute;top:92px;left:50%;width:10px;height:7px;background:#bc8178;border-radius:50%;transform:translateX(-50%)}.mouth{position:absolute;top:98px;left:50%;transform:translateX(-50%)}.cheek{position:absolute;top:91px;width:22px;height:12px;border-radius:50%;background:#efa5a0a8}.cheek.l{left:20px}.cheek.r{right:20px}.bubble{position:absolute;top:12%;right:5%;background:#fffaf1;border:2px solid white;border-radius:18px;padding:9px 11px;font-size:12px}.side{position:absolute;top:21%;display:grid;gap:9px;z-index:5}.side.l{left:0}.side.r{right:0}.side button{width:59px;border:2px solid white;border-radius:17px;background:#ffffffdf;padding:6px 2px;font-weight:900;font-size:11px;color:#654832}.side span{display:block;font-size:26px}.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:7px;background:#fff5e6e8;border:2px solid white;border-radius:22px;margin-top:-5px}.quick button{border:0;border-radius:15px;background:linear-gradient(white,#ead7c5);box-shadow:0 3px #cba98b;padding:7px 1px;color:#624733;font-size:11px;font-weight:900}.quick span{display:block;font-size:25px}.status{background:#fff8edeb;border:2px solid white;border-radius:16px;padding:8px 11px;margin-top:8px;font-size:11px}.row{display:flex;justify-content:space-between;font-weight:800}.bar{height:7px;background:#e7d6c5;border-radius:9px;margin:4px 0 7px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#f49b9f,#f6c36c)}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.nav button{border:0;border-radius:13px;background:#e9c9a8;color:#654832;padding:9px 1px;font-size:11px;font-weight:900;box-shadow:0 3px #bd936c}.nav span{display:block;font-size:20px}.overlay{position:fixed;z-index:20;inset:0;background:#332317aa;display:none;align-items:flex-end;justify-content:center;padding:12px}.modal{width:min(500px,100%);background:#fff7e9;border:3px solid white;border-radius:24px;padding:17px;max-height:82svh;overflow:auto}.modal h2{margin:0 0 8px}.modal p{font-size:13px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.tile{background:#f2e2cf;border:0;border-radius:14px;padding:12px;text-align:center;font-size:13px}.tile b{display:block;font-size:26px}.primary,.secondary{border:0;border-radius:20px;padding:11px 17px;font-weight:900;margin:4px}.primary{background:#e59c69;color:white}.secondary{background:#e9d7c2;color:#694a34}.toast{position:fixed;z-index:30;top:12%;left:50%;transform:translateX(-50%);background:#fff8e9;border:2px solid white;border-radius:22px;padding:9px 15px;display:none;font-size:13px;font-weight:800}@keyframes bob{50%{transform:translate(-50%,-7px)}}@media(max-height:700px){.room{height:38svh;min-height:250px}.stats{margin:5px 0}.quick{padding:5px}.status{padding:6px 9px}.nav{margin-top:6px}}
</style></head><body><main id="game"><div class="sky"></div><div class="sofa"></div><div class="shelf"></div><div class="floor"></div><div class="rug"></div>
<header class="top"><div class="profile"><div class="avatar">🐰</div><div>东<div class="sub">Lv.<b id="level">1</b> · 小兔子</div></div></div><div class="money">🪙 <b id="coins">500</b>　💎 <b id="gems">10</b></div></header>
<section class="stats"><div class="stat">🍽️ 饱腹<b id="food">100%</b></div><div class="stat">😊 心情<b id="mood">100%</b></div><div class="stat">⚡ 精力<b id="energy">100%</b></div></section>
<section class="room"><div class="bubble" id="speech">Hi～一起玩吧！ 💗</div><div class="side l"><button onclick="checkin()"><span>🗓️</span>签到</button><button onclick="reward()"><span>🎁</span>奖励</button><button onclick="panel('小游戏')"><span>🎮</span>小游戏</button></div><div class="side r"><button onclick="panel('冒险')"><span>🗺️</span>冒险</button><button onclick="panel('战斗')"><span>🐺</span>战斗</button></div><div class="pet" id="pet"><div class="ear l"></div><div class="ear r"></div><div class="bunny"><i class="eye l"></i><i class="eye r"></i><i class="nose"></i><i class="mouth">ω</i><i class="cheek l"></i><i class="cheek r"></i></div></div></section>
<section class="quick"><button onclick="act('摸摸')"><span>🖐🏻</span>抚摸</button><button onclick="act('喂食')"><span>🥕</span>喂食</button><button onclick="act('玩耍')"><span>🧶</span>玩耍</button><button onclick="panel('换装')"><span>👕</span>换装</button><button onclick="act('睡觉')"><span>🛏️</span>睡觉</button></section>
<section class="status"><div class="row"><span>💗 亲密度 · Lv.<b id="lv2">1</b></span><span><b id="bond">0</b> / 100</span></div><div class="bar"><i id="bondbar" style="width:0%"></i></div><div class="row"><span>🌱 成长经验</span><span id="xp">0 / 100</span></div><div class="bar"><i id="xpbar" style="width:0%"></i></div></section>
<nav class="nav"><button onclick="panel('任务')"><span>📋</span>任务</button><button onclick="panel('商店')"><span>🛍️</span>商店</button><button onclick="panel('跑酷')"><span>🏃</span>跑酷</button><button onclick="panel('图鉴')"><span>📖</span>图鉴</button></nav></main><div class="toast" id="toast"></div><div class="overlay" id="overlay"><section class="modal"><h2 id="title"></h2><p id="desc"></p><div id="content"></div><button class="secondary" onclick="closePanel()">回到兔屋</button></section></div>
<script>
const base={coins:500,gems:10,food:100,mood:100,energy:100,bond:0,xp:0,level:1,checked:"",claimed:false};let s={...base,...JSON.parse(localStorage.getItem("dongRabbitSave")||"{}")};const $=x=>document.getElementById(x);function save(){localStorage.setItem("dongRabbitSave",JSON.stringify(s));draw()}function draw(){["coins","gems","food","mood","energy","bond","level"].forEach(k=>$(k).textContent=s[k]+(["food","mood","energy"].includes(k)?"%":""));$("lv2").textContent=s.level;$("xp").textContent=s.xp+" / 100";$("bondbar").style.width=s.bond+"%";$("xpbar").style.width=s.xp+"%"}function say(t){$("speech").textContent=t;$("toast").textContent=t;$("toast").style.display="block";clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$("toast").style.display="none",1800)}function exp(n){s.xp+=n;s.bond=Math.min(100,s.bond+Math.ceil(n/2));if(s.xp>=100){s.xp-=100;s.level++;s.gems+=2;say("升级啦！东长大了一点点！🎉")}}function act(a){if(a==="喂食"){if(s.coins<10)return say("金币不够啦");s.coins-=10;s.food=Math.min(100,s.food+22);s.mood=Math.min(100,s.mood+4);exp(5);say("咔嚓咔嚓，胡萝卜真好吃！🥕")}if(a==="摸摸"){s.mood=Math.min(100,s.mood+10);exp(4);say("呼噜呼噜～最喜欢你摸摸啦！💗")}if(a==="玩耍"){if(s.energy<12)return say("东困啦，先休息一下吧");s.energy-=12;s.mood=Math.min(100,s.mood+14);exp(7);say("好开心！再玩一会儿嘛！")}if(a==="睡觉"){s.energy=100;say("晚安～东睡饱啦！🌙")}save()}$("pet").onclick=()=>act("摸摸");function checkin(){let d=new Date().toLocaleDateString();if(s.checked===d)return say("今天已经签到过啦");s.checked=d;s.coins+=80;s.gems++;exp(10);say("签到成功！金币+80，钻石+1 🎁");save()}function reward(){if(s.claimed)return say("今日奖励已经领过啦");s.claimed=true;s.coins+=50;exp(8);say("每日礼物到账：金币+50！");save()}function panel(name){$("overlay").style.display="flex";$("title").textContent=name;$("desc").textContent="和东一起探索更多有趣的日常吧！";let c=$("content");c.innerHTML="";c.className="";function btn(t,f){let b=document.createElement("button");b.className="primary";b.textContent=t;b.onclick=f;c.append(b)}function tile(e,t,d){let x=document.createElement("div");x.className="tile";x.innerHTML="<b>"+e+"</b>"+t+"<br><small>"+d+"</small>";c.append(x)}if(name==="任务"){c.className="grid";[["🖐🏻","摸摸东一次","亲密度+4"],["🥕","喂东一根胡萝卜","经验+5"],["🏃","完成跑酷","金币奖励"],["🗺️","森林探险","随机宝箱"]].forEach(x=>tile(...x));btn("领取任务礼包 +60金币",()=>{s.coins+=60;exp(8);save();say("任务礼包领取成功！")})}else if(name==="换装"){c.className="grid";[["🎀","蝴蝶结",0],["👑","皇冠",30],["🧢","小鸭帽",45],["🧣","暖暖围巾",60]].forEach(([e,t,v])=>{let b=document.createElement("button");b.className="tile";b.innerHTML="<b>"+e+"</b>"+t+"<br>"+(v?v+"金币":"免费");b.onclick=()=>{if(s.coins<v)return say("金币不足哦");s.coins-=v;say("东换上新装扮啦！"+e);save()};c.append(b)})}else if(name==="商店"){c.className="grid";[["🥕","胡萝卜礼包",20],["🧶","彩色毛线球",35],["🧸","软绵绵玩偶",50],["💎","钻石 x5",100]].forEach(([e,t,v],i)=>{let b=document.createElement("button");b.className="tile";b.innerHTML="<b>"+e+"</b>"+t+"<br>"+v+"金币";b.onclick=()=>{if(s.coins<v)return say("金币不够啦");s.coins-=v;if(i===3)s.gems+=5;else{s.mood=Math.min(100,s.mood+5);exp(3)}save();say("购买成功！")};c.append(b)})}else if(name==="跑酷"||name==="小游戏"){tile("🏃","森林跑酷","点击跳跃，收集胡萝卜");let score=0,p=document.createElement("p");p.textContent="本局收集：0 根";c.append(p);btn("跳跃收集 +1",()=>{score++;p.textContent="本局收集："+score+" 根胡萝卜"});btn("结束并领取奖励",()=>{let r=score*6+10;s.coins+=r;s.energy=Math.max(0,s.energy-8);exp(score+5);save();say("跑酷完成！获得 "+r+" 金币")})}else if(name==="战斗"){let enemy=50,hp=100,p=document.createElement("p");p.textContent="🐰 东 HP 100　👾 史莱姆 HP 50";c.append(p);btn("🥕 胡萝卜冲击",()=>{enemy=Math.max(0,enemy-18);hp=Math.max(0,hp-8);p.textContent="东 HP "+hp+"　怪物 HP "+enemy;if(enemy===0){s.coins+=45;exp(18);save();p.textContent+="　胜利！奖励已领取"}else if(!hp)p.textContent="东需要休息，下次再战！"})}else if(name==="冒险"){c.className="grid";[["🌳","迷雾森林","普通探险"],["🏖️","阳光海岸","收集贝壳"],["🏔️","雪绒山谷","寻找宝物"]].forEach(x=>tile(...x));btn("出发探索并开启宝箱",()=>{let r=25+Math.floor(Math.random()*50);s.coins+=r;exp(12);s.energy=Math.max(0,s.energy-10);save();say("发现宝箱！金币 +"+r+" 🧰")})}else if(name==="图鉴"){c.className="grid";[["🐰","东","最可爱的小伙伴"],["🥕","胡萝卜","东的最爱"],["🧸","玩偶","陪伴玩耍"],["🌟","勇者徽章","战斗胜利获得"]].forEach(x=>tile(...x))}}function closePanel(){$("overlay").style.display="none"}draw();setInterval(()=>{s.food=Math.max(0,s.food-1);if(s.energy<100&&s.food>15)s.energy=Math.min(100,s.energy+1);if(s.food<25)s.mood=Math.max(0,s.mood-1);draw();localStorage.setItem("dongRabbitSave",JSON.stringify(s))},60000);
</script></body></html>
