<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#2b1e16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>东的小兔屋 · 互动养成</title>
<meta name="description" content="和东一起住在软软的小兔屋里：抚摸、喂食、玩耍、换装、睡觉、亲昵、小游戏、冒险、战斗和竖屏跑酷。东会叫玩家“鸦鸦主人”。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23fbe8d3'/%3E%3Cellipse cx='24' cy='18' rx='8' ry='15' fill='%23efc394'/%3E%3Cellipse cx='42' cy='21' rx='7' ry='13' fill='%23efc394' transform='rotate(20 42 21)'/%3E%3Cellipse cx='32' cy='40' rx='20' ry='18' fill='%23f8ddbc'/%3E%3Ccircle cx='25' cy='39' r='2.4' fill='%234a3b32'/%3E%3Ccircle cx='39' cy='39' r='2.4' fill='%234a3b32'/%3E%3Cpath d='M32 44l-2.5 2M32 44l2.5 2' stroke='%23b97c6a' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="portrait.css">
<link rel="stylesheet" href="parkour.css">
</head>
<body>
<div id="rotate">
  <div class="rotate-card">
    <div class="rotate-phone"><span>📱</span></div>
    <h2>把手机竖过来</h2>
    <p>东的小兔屋是竖屏小游戏<br>旋转手机，房间会更高更可爱</p>
    <button id="rotateFullscreen">全屏并尝试竖屏</button>
  </div>
</div>

<main id="stage" aria-label="东的小兔屋，竖屏互动养成游戏">
  <div class="room" aria-hidden="true">
    <div class="wall"></div>
    <div class="wall-trim"></div>
    <div class="floor"></div>

    <div class="window">
      <div class="sky">
        <div class="sun"></div>
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
        <div class="tree t1"></div>
        <div class="tree t2"></div>
        <div class="tree t3"></div>
      </div>
      <div class="window-bar v"></div>
      <div class="window-bar h"></div>
      <div class="window-sill"></div>
    </div>
    <div class="curtain left"></div>
    <div class="curtain right"></div>
    <div class="beam b1"></div>
    <div class="beam b2"></div>

    <div class="shelf">
      <div class="shelf-board"></div>
      <div class="book b1"></div><div class="book b2"></div><div class="book b3"></div><div class="book b4"></div>
      <div class="shelf-plant"><span>🌿</span></div>
      <div class="mini-frame"><img src="bunny_photo.jpg" alt=""></div>
    </div>

    <div class="wall-pic"><span>🌼</span></div>

    <div class="sofa">
      <div class="sofa-back"></div>
      <div class="sofa-seat"></div>
      <div class="sofa-arm left"></div>
      <div class="sofa-arm right"></div>
      <div class="sofa-cushion check"></div>
      <div class="sofa-cushion carrot">🥕</div>
      <div class="sofa-leg l"></div><div class="sofa-leg r"></div>
    </div>

    <div class="cat-tree">
      <div class="tree-pole"></div>
      <div class="tree-base"></div>
      <div class="tree-house">
        <div class="tree-ear left"></div><div class="tree-ear right"></div>
        <div class="tree-hole"></div>
      </div>
      <div class="tree-platform"></div>
      <div class="tree-ball">🧶</div>
    </div>

    <div class="plant">
      <div class="pot"></div>
      <div class="leaves">🌿</div>
    </div>

    <div class="rug">
      <div class="rug-inner"></div>
      <div class="paw p1">🐾</div><div class="paw p2">🐾</div><div class="paw p3">🐾</div>
    </div>

    <div class="dust d1"></div><div class="dust d2"></div><div class="dust d3"></div><div class="dust d4"></div>
  </div>

  <div class="pet-wrap" id="petWrap">
    <div class="pet-shadow"></div>
    <img class="pet-img" id="petImg" src="bunny.png" alt="东，一只金橘色的小兔子" draggable="false">
    <div class="pet-blush" aria-hidden="true"><i></i><i></i></div>
    <div class="pet-acc" id="petAcc" aria-hidden="true"></div>
    <div class="speech" id="speech" role="status" aria-live="polite">鸦鸦主人～<br>你回来啦！</div>
  </div>

  <div id="fxLayer" aria-hidden="true"></div>

  <header class="hud">
    <section class="profile panel">
      <div class="avatar-wrap">
        <img src="bunny_photo.jpg" alt="东的头像">
        <span class="level-badge" id="levelBadge">1</span>
      </div>
      <div class="profile-info">
        <div class="name-row"><b id="petName">东</b><span id="lvText">Lv.1</span></div>
        <div class="heart-row">
          <span class="heart">❤️</span>
          <div class="heart-bar"><i id="bondFill"></i></div>
          <em id="bondText">35/100</em>
        </div>
      </div>
      <button class="edit-name" id="editName" aria-label="给兔子改名">✎</button>
    </section>

    <section class="stats">
      <div class="stat-card" id="statHunger">
        <span class="stat-ico">🍽️</span>
        <div class="stat-body">
          <div class="stat-line"><span>饱腹</span><b id="hungerVal">78%</b></div>
          <div class="stat-bar"><i id="hungerBar"></i></div>
        </div>
      </div>
      <div class="stat-card" id="statMood">
        <span class="stat-ico">😊</span>
        <div class="stat-body">
          <div class="stat-line"><span>心情</span><b id="moodVal">82%</b></div>
          <div class="stat-bar"><i id="moodBar"></i></div>
        </div>
      </div>
      <div class="stat-card" id="statEnergy">
        <span class="stat-ico">⚡</span>
        <div class="stat-body">
          <div class="stat-line"><span>精力</span><b id="energyVal">86%</b></div>
          <div class="stat-bar"><i id="energyBar"></i></div>
        </div>
      </div>
    </section>

    <section class="currency">
      <div class="currency-pill coin"><span>🪙</span><b id="coinVal">500</b><button data-shop="coin" aria-label="获取金币">+</button></div>
      <div class="currency-pill gem"><span>💎</span><b id="gemVal">10</b><button data-shop="gem" aria-label="获取宝石">+</button></div>
      <button class="gear" id="settingsBtn" aria-label="设置">⚙️</button>
    </section>
  </header>

  <aside class="rail rail-left">
    <button class="side-btn" data-open="checkin"><span class="side-ico blue">📅</span><b>签到</b></button>
    <button class="side-btn" data-open="rewards"><span class="side-ico pink">🎁</span><b>奖励</b></button>
    <button class="side-btn" data-open="minigame"><span class="side-ico purple">🎮</span><b>小游戏</b></button>
  </aside>

  <aside class="rail rail-right">
    <button class="side-btn" data-open="adventure"><span class="side-ico green">🗺️</span><b>冒险</b></button>
    <button class="side-btn" data-open="battle"><span class="side-ico orange">⚔️</span><b>战斗</b></button>
    <button class="side-btn" data-open="parkour"><span class="side-ico peach">🏃</span><b>跑酷</b></button>
  </aside>

  <div class="bond-card panel">
    <div class="bond-title"><span>💗 亲密度</span><em id="bondLevelSmall">Lv.1</em></div>
    <div class="bond-bar"><i id="bondFill2"></i></div>
    <div class="bond-num"><span id="bondText2">35 / 100</span><span>和东的每一天</span></div>
  </div>

  <div class="action-bar">
    <button class="action-btn" data-action="pet"><span class="act-ico">🤚</span><span>抚摸</span></button>
    <button class="action-btn" data-action="feed"><span class="act-ico">🥕</span><span>喂食</span></button>
    <button class="action-btn" data-action="play"><span class="act-ico">🧶</span><span>玩耍</span></button>
    <button class="action-btn" data-action="affection"><span class="act-ico">💗</span><span>亲昵</span></button>
    <button class="action-btn" data-action="dress"><span class="act-ico">👕</span><span>换装</span></button>
    <button class="action-btn" data-action="sleep"><span class="act-ico">😴</span><span>睡觉</span></button>
  </div>

  <button class="heal-btn" id="healBtn">
    <span class="heal-ico">❤️‍🩹</span>
    <b>恢复</b>
    <em>休息一下</em>
  </button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div id="overlayRoot"></div>
  <div id="gameRoot"></div>

  <div id="parkourRoot" aria-hidden="true">
    <div class="pk">
      <canvas id="pkCanvas" width="1000" height="2000"></canvas>

      <div class="pk-hud">
        <div class="pk-stat"><span>距离</span><b id="pkDist">0</b><em>m</em></div>
        <div class="pk-stat"><span>得分</span><b id="pkScore">0</b></div>
        <div class="pk-best">最佳 <b id="pkBest">0</b></div>
        <div class="pk-hud-btns">
          <button id="pkPause" aria-label="暂停">❚❚</button>
          <button id="pkQuit" aria-label="退出">×</button>
        </div>
      </div>

      <div class="pk-controls" id="pkControls">
        <button data-pk="left" aria-label="向左换道"><b>←</b><small>左</small></button>
        <button data-pk="jump" aria-label="跳跃" class="pk-jump"><b>↑</b><small>跳</small></button>
        <button data-pk="slide" aria-label="滑铲" class="pk-slide"><b>↓</b><small>滑</small></button>
        <button data-pk="right" aria-label="向右换道"><b>→</b><small>右</small></button>
      </div>

      <div class="pk-overlay show" id="pkStart">
        <div class="pk-card pk-start-card">
          <div class="pk-kicker">🐇 东的跑酷</div>
          <h2>胡萝卜跑酷</h2>
          <p>三条车道，躲开卡车和路障<br>左右换道 · 上滑跳跃 · 下滑滑铲</p>
          <div class="pk-how">
            <div><span>← →</span><small>换道</small></div>
            <div><span>↑</span><small>跳过路障</small></div>
            <div><span>↓</span><small>滑过横杆</small></div>
          </div>
          <button class="pk-primary" id="pkStartBtn">开始跑酷</button>
          <button class="pk-ghost" id="pkStartClose">回小屋</button>
        </div>
      </div>

      <div class="pk-overlay" id="pkPauseOver">
        <div class="pk-card">
          <div class="pk-kicker">☕ 暂停</div>
          <h2>休息一下</h2>
          <p>东在路边等你。</p>
          <button class="pk-primary" id="pkResume">继续跑</button>
          <button class="pk-ghost" id="pkExit">退出跑酷</button>
        </div>
      </div>

      <div class="pk-overlay" id="pkOver">
        <div class="pk-card" id="pkOverCard"></div>
      </div>

      <div class="pk-count" id="pkCount"></div>
    </div>
  </div>

  <div class="night-layer" id="nightLayer" aria-hidden="true">
    <div class="night-moon"></div>
    <i class="nstar s1"></i><i class="nstar s2"></i><i class="nstar s3"></i><i class="nstar s4"></i><i class="nstar s5"></i>
    <div class="night-zzz"><i>z</i><i>z</i><i>z</i></div>
    <p>晚安，东</p>
    <button id="wakeBtn">轻轻叫醒它</button>
  </div>

  <div class="name-dialog" id="nameDialog" aria-hidden="true">
    <div class="name-card">
      <h3>给它取个名字</h3>
      <input id="nameInput" maxlength="8" value="东" aria-label="兔子的名字">
      <div class="name-actions"><button id="nameCancel">取消</button><button id="nameSave">保存</button></div>
    </div>
  </div>
</main>

<script src="game.js"></script>
</body>
</html>
